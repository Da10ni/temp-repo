<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; }
    .container { width: 100%; max-width: 500px; }
    h1 { font-size: 28px; margin-bottom: 24px; color: #38bdf8; }
    .add-form { display: flex; gap: 8px; margin-bottom: 24px; }
    .add-form input { flex: 1; padding: 10px 14px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-size: 14px; outline: none; }
    .add-form input:focus { border-color: #38bdf8; }
    .add-form button { padding: 10px 20px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .add-form button:hover { background: #7dd3fc; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .task { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; }
    .task.done .task-title { text-decoration: line-through; color: #64748b; }
    .task input[type="checkbox"] { width: 18px; height: 18px; accent-color: #38bdf8; cursor: pointer; }
    .task-title { flex: 1; font-size: 14px; }
    .task .delete { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 18px; padding: 0 4px; }
    .task .delete:hover { color: #f87171; }
    .empty { text-align: center; color: #64748b; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    <div class="add-form">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button onclick="addTask()">Add</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    const API = '/api/tasks';

    async function loadTasks() {
      const res = await fetch(API);
      const tasks = await res.json();
      const list = document.getElementById('taskList');
      if (tasks.length === 0) {
        list.innerHTML = '<li class="empty">No tasks yet. Add one above!</li>';
        return;
      }
      list.innerHTML = tasks.map(t => `
        <li class="task ${t.done ? 'done' : ''}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id}, this.checked)" />
          <span class="task-title">${escapeHtml(t.title)}</span>
          <button class="delete" onclick="deleteTask(${t.id})">&#x2715;</button>
        </li>
      `).join('');
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const title = input.value.trim();
      if (!title) return;
      await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title }) });
      input.value = '';
      loadTasks();
    }

    async function toggleTask(id, done) {
      await fetch(`${API}/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ done }) });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
    loadTasks();
  </script>
</body>
</html>
